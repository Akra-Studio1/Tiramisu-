<!-- ИНТРО: чашка кофе + молоко + латте-арт -->
<div id="intro" aria-hidden="true">

      <radialGradient id="milkG" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1E2CF"/></radialGradient>
      <linearGradient id="streamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".25" stop-color="#fff"/><stop offset="1" stop-color="#FFF9F1"/></linearGradient>
      <clipPath id="coffeeClip"><circle cx="160" cy="190" r="84"/></clipPath>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    </defs>
    <g id="cup">
      <circle cx="160" cy="190" r="128" fill="#F3E7D7" filter="url(#soft)"/>
      <circle cx="160" cy="190" r="112" fill="none" stroke="#E6D3BC" stroke-width="2"/>
      <rect x="248" y="176" width="58" height="28" rx="14" fill="#FFFFFF"/>

      <circle cx="160" cy="190" r="86" fill="#EDE2D4"/>
      <g clip-path="url(#coffeeClip)">
        <circle id="coffee" cx="160" cy="190" r="84" fill="url(#crema)"/>
        <circle id="ripple" cx="160" cy="232" r="20" fill="none" stroke="#C8946A" stroke-width="2" opacity="0"/>
        <circle id="milkBase" cx="160" cy="226" r="30" fill="url(#milkG)"/>

        <path id="pull" d="M160 132 L160 250" stroke="#FFF9F1" stroke-width="3" stroke-linecap="round" fill="none"/>

    </g>
    <g id="pour">
      <path id="stream" d="M236 30 C214 68 172 120 160 232" stroke="url(#streamG)" stroke-width="6" stroke-linecap="round" fill="none"/>

      <path d="M138 92c-10-14 10-22 0-38"/><path d="M162 86c-10-14 10-22 0-38"/><path d="M186 92c-10-14 10-22 0-38"/>

  </svg>
  <div class="intro-brand"><b>ТИРАМИСУ</b><span>Жаркент</span></div>
  <button id="skipIntro" type="button" data-i18n="skip">Пропустить</button>

<header class="header" id="top">
  <div class="wrap header-in">
    <a href="#home" class="logo" aria-label="ТИРАМИСУ"><span class="logo-mark">T</span><span><b>ТИРАМИСУ</b><small>Жаркент</small></span></a>
    <nav class="nav" id="nav" aria-label="Навигация"></nav>
    <div class="head-actions">
      <div class="lang" role="group" aria-label="Язык / Тіл"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="kz">KZ</button></div>
      <button class="cart-btn" id="cartBtn" type="button" aria-label="Корзина"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span id="cartCount">0</span></button>

<main>

      <div class="hero-text">
        <p class="eyebrow">ТИРАМИСУ · Жаркент</p>
        <h1 id="heroTitle" data-i18n="heroTitle">Сладкие моменты начинаются здесь</h1>
        <p class="lead" data-i18n="heroSub"></p>
        <div class="hero-btns"><a href="#menu" class="btn shine" data-i18n="seeMenu">Посмотреть меню</a><button type="button" class="btn btn-ghost" id="heroOrder" data-i18n="makeOrder">Сделать заказ</button></div>
      </div>
      <div class="hero-art" id="heroArt"></div>
    </div>
  </section>

  <section class="section" id="menu">
    <div class="wrap">
      <h2 class="title" data-i18n="menu">Меню</h2>
      <div class="tools">
        <label class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" maxlength="40" data-i18n-ph="search"></label>

  <section class="section alt" id="about">

      <div class="about-pics" id="aboutPics"></div>
      <div><h2 class="title left" data-i18n="aboutTitle"></h2><p class="lead" data-i18n="aboutText"></p><p class="lead" id="story"></p></div>
    </div>
  </section>

  <section class="section" id="gallery">
    <div class="wrap">
      <h2 class="title" data-i18n="gallery">Галерея</h2>
      <div class="chips" id="galChips"></div>
      <div class="gallery" id="galGrid"></div>
    </div>
  </section>

  <section class="section alt" id="social">
    <div class="wrap center"><h2 class="title" data-i18n="social"></h2><div class="socials" id="socials"></div></div>

  <section class="section" id="contacts">
    <div class="wrap contacts">
      <div>
        <h2 class="title left" data-i18n="contacts">Контакты</h2>
        <ul class="info">
          <li><b>ТИРАМИСУ</b></li>
          <li><span data-i18n="city"></span>: <span data-i18n="cityVal"></span></li>
          <li>WhatsApp: <a id="cPhone" target="_blank" rel="noopener"></a></li>
          <li><span data-i18n="address"></span>: <span id="cAddr"></span></li>
          <li><span data-i18n="hours"></span>: <span id="cHours"></span></li>
        </ul>
      </div>
      <div class="map" id="mapBox"></div>
